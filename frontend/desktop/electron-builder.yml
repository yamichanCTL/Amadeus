appId: com.asrapp.desktop
productName: Amadeus
beforePack: scripts/prepare-runtime.cjs
afterSign: scripts/verify-windows-icon.cjs
icon: ../../img/Amadeus/amadeus-icon.png
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - "!dist-electron/electron/**/*"
  - "!**/*.glb"
  - "!**/*.gltf"
extraResources:
  - from: electron/Set-PetTopmost.ps1
    to: pet/Set-PetTopmost.ps1
  - from: ../../img/Amadeus
    to: img/Amadeus
    filter:
      - amadeus.jpg
      - amadeus-icon.png
      - amadeus.ico
win:
  icon: ../../img/Amadeus/amadeus.ico
  extraResources:
    - from: ../../.runtime/windows-bootstrap
      to: runtime
      filter:
        - uv.exe
        - manifest.json
        - LICENSE-APACHE
        - LICENSE-MIT
    - from: ../../backend/app
      to: backend-bundle/backend/app
      filter:
        - "**/*.py"
        - "**/*.json"
        - "!**/__pycache__/**"
    - from: ../../runner
      to: backend-bundle/runner
      filter:
        - "**/*.py"
        - "**/*.json"
        - "!**/__pycache__/**"
    - from: ../../pyproject.toml
      to: backend-bundle/pyproject.toml
    - from: ../../uv.lock
      to: backend-bundle/uv.lock
  # Resource editing writes the app icon and version even when no signing certificate is set.
  signAndEditExecutable: true
  signDlls: false
  target:
    - target: nsis
      arch:
        - x64
nsis:
  include: electron/installer-storage.nsh
  installerIcon: ../../img/Amadeus/amadeus.ico
  uninstallerIcon: ../../img/Amadeus/amadeus.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  perMachine: false
  allowElevation: false
  artifactName: Amadeus-Windows-Setup-${version}.${ext}
linux:
  icon: ../../img/Amadeus/amadeus-icon.png
  target:
    - AppImage
